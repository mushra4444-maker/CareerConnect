
{% extends 'base.html' %}

{% block title %}Edit Job - CareerConnect{% endblock %}

{% block content %}

<div class="container mt-5 mb-5">

    <div class="row justify-content-center">

        <div class="col-md-8">

            <div class="card p-4">

                <h2 class="text-center fw-bold mb-4">
                    Edit Job Posting
                </h2>

                <form method="POST">

                    {% csrf_token %}

                    {% for field in form %}

                    <div class="mb-3">

                        <label class="form-label fw-semibold">
                            {{ field.label }}
                        </label>

                        {{ field }}

                        {% if field.errors %}
                            <div class="text-danger small mt-1">
                                {{ field.errors }}
                            </div>
                        {% endif %}

                    </div>

                    {% endfor %}

                    <div class="d-flex gap-2">

                        <button type="submit" class="btn btn-primary">
                            Save Changes
                        </button>

                        <a href="{% url 'employer_dashboard' %}"
                           class="btn btn-secondary">
                            Cancel
                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
